name: Test

on:
  push:
    branches: [main, master]
    paths:
      - 'go/**'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'go/**'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Tidy modules
        run: cd go && go mod tidy

      - name: Check formatting
        run: test -z "$(cd go && gofmt -l .)"

      - name: Vet
        run: cd go && go vet ./...

      - name: Run tests
        run: cd go && go test ./...

      - name: Build
        run: cd go && go build -ldflags="-s -w" -o mrlib ./cmd/mrlib

      - name: Verify binary
        run: |
          ./go/mrlib --help
          ./go/mrlib --version
          ./go/mrlib lib --help
          ./go/mrlib doc --help
          ./go/mrlib sync --help

      - name: Check install script syntax
        run: sh -n install.sh
