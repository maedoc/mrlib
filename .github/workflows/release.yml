name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: linux-amd64
            binary_name: mrlib-linux-amd64
          - os: linux
            arch: arm64
            target: linux-arm64
            binary_name: mrlib-linux-arm64
          - os: darwin
            arch: amd64
            target: darwin-amd64
            binary_name: mrlib-darwin-amd64
          - os: darwin
            arch: arm64
            target: darwin-arm64
            binary_name: mrlib-darwin-arm64
          - os: windows
            arch: amd64
            target: windows-amd64
            binary_name: mrlib-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Tidy modules
        run: cd go && go mod tidy

      - name: Vet
        run: cd go && go vet ./...

      - name: Run tests
        run: cd go && go test ./...

      - name: Build
        run: |
          cd go
          VERSION="${GITHUB_REF_NAME:-dev}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w -X github.com/maedoc/mrlib/go/internal/cli.version=${VERSION}" \
            -o ../${{ matrix.binary_name }} ./cmd/mrlib

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mrlib-${{ matrix.target }}
          path: ${{ matrix.binary_name }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mrlib-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## mrlib ${{ github.ref_name }}

            Mistral AI Libraries CLI with two-way file synchronization.

            ### Install

            One-liner (binary from this release):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/maedoc/mrlib/master/install.sh | sh
            ```

            Or with the Go toolchain (no release needed):

            ```bash
            go install github.com/maedoc/mrlib/go/cmd/mrlib@latest
            ```

            ### Assets
            - **Linux (x86_64)**: `mrlib-linux-amd64`
            - **Linux (ARM64)**: `mrlib-linux-arm64`
            - **macOS (Intel)**: `mrlib-darwin-amd64`
            - **macOS (Apple Silicon)**: `mrlib-darwin-arm64`
            - **Windows (x86_64)**: `mrlib-windows-amd64.exe`

            Verify downloads with `SHA256SUMS`:
            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```
          files: |
            artifacts/*
